# 今回はapplicationでフロントエンド、バックエンドをまとめる。
# サービスはapplicationとdatabaseの2構成でいく。*本番がここにnginxを入れる

services:
  application:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    ports:
      - "3001:3000" # Vite
      - "8001:8000" # Hono
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/app
      VITE_API_URL: http://localhost:8001
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: Schedule App DEV
      WEBAUTHN_ORIGIN: http://localhost:3001
      SECRET_KEY: local-secret-key
      ACCESS_TOKEN_EXPIRES_IN: "5"
      REFRESH_TOKEN_EXPIRES_IN: "7"
      ALGORITHM: HS256
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
  postgres_data:
