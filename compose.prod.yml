name: schedule-production

services:
  application:
    image: ${APPLICATION_IMAGE:?APPLICATION_IMAGE is required}
    env_file: .env.prod
    expose:
      - "8000"
    networks:
      gateway:
        aliases:
          - production-app
      internal:
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 450m
    restart: unless-stopped

  email-worker:
    image: ${APPLICATION_IMAGE:?APPLICATION_IMAGE is required}
    env_file: .env.prod
    environment:
      EMAIL_PROVIDER: brevo
      WORKER_HEARTBEAT_FILE: /tmp/daily-email-worker.heartbeat
    command: ["node", "dist/backend/daily-email.js"]
    networks:
      - gateway
      - internal
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const fs=require(''fs'');try{process.exit(Date.now()-fs.statSync(''/tmp/daily-email-worker.heartbeat'').mtimeMs < 90000 ? 0 : 1)}catch{process.exit(1)}"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  database:
    image: postgres:15
    env_file: .env.prod
    networks:
      - internal
    volumes:
      - production-db:/var/lib/postgresql/data
    mem_limit: 700m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE is required}
    env_file: .env.prod
    networks:
      - internal
    depends_on:
      database:
        condition: service_healthy
    profiles: ["migration"]
    restart: "no"

networks:
  gateway:
    external: true
    name: schedule-gateway
  internal:
    internal: true

volumes:
  production-db:
